<div class="row-layout login-form-container">
  <div class="column-layout login-form">
    <h4 class="login-title">
      Login
    </h4>
    <div class="column-layout login-inputs">
      <igx-input-group type="border" class="email-input-login">
        <input type="email" [(ngModel)]="value" required="true" igxInput #igxInput />
        <label igxLabel>Email address</label>
        @if (igxInput.validity.valueMissing) {
          <igx-hint>This field is required</igx-hint>
        }
      </igx-input-group>
      <igx-input-group type="border" class="email-input-login">
        <input type="password" [(ngModel)]="value1" required="true" igxInput #igxInput1 />
        <label igxLabel>Password</label>
        @if (igxInput1.validity.valueMissing) {
          <igx-hint>This field is required</igx-hint>
        }
      </igx-input-group>
      <div class="row-layout remember-forgot">
        <igx-checkbox labelPosition="after" class="remember-me">
          Remember me
        </igx-checkbox>
        <a target="_blank" class="ig-typography__body-2 forgot-password">
          Forgot your password?
        </a>
      </div>
      <button igxButton="contained" type="button" class="sign-in-button">
        Sign in
      </button>
    </div>
    <div class="row-layout create-account">
      <p class="ig-typography__body-2 no-account-text">
        Don't have an account?
      </p>
      <a target="_blank" [routerLink]="['/register-page']" class="ig-typography__body-2 create-new-account-link">
        Create new account
      </a>
    </div>
  </div>
</div>
